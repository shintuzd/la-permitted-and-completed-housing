name: Update data

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays at 7am Pacific (6am in winter)
  workflow_dispatch:         # "Run workflow" button for updates after editing the Google Sheet

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build data
        run: python pipeline/build.py
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data cache manual review
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
